<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CORTIS-FLIX - Show Video</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #121212; color: #ffffff; font-family: 'Arial Black', Arial, sans-serif; padding-bottom: 50px; }
    .navbar { display: flex; align-items: center; justify-content: space-between; background-color: #0d0d0d; padding: 15px 30px; border-bottom: 2px solid #222; position: sticky; top: 0; z-index: 100; }
    .logo a { color: #e50914; font-size: 28px; font-weight: bold; letter-spacing: 1.5px; text-decoration: none; }
    .nav-links { list-style: none; display: flex; gap: 20px; }
    .nav-links a { color: #b3b3b3; font-size: 13px; text-transform: uppercase; text-decoration: none; padding-bottom: 4px; transition: color 0.2s, border-color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: #ffffff; border-bottom: 2px solid #e50914; }
    .search-box input { background-color: #ffffff; border: none; padding: 6px 12px; border-radius: 2px; font-size: 12px; outline: none; }
    .main-content { padding: 30px; }
    .back-btn { display: inline-block; color: #e50914; text-decoration: none; margin-bottom: 20px; font-size: 14px; }
    .back-btn:hover { text-decoration: underline; }
    .section-title { font-size: 22px; text-transform: uppercase; color: #ffffff; margin-bottom: 20px; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .card { background-color: #1a1a1a; border: 2px solid #2a2a2a; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: transform 0.2s ease, border-color 0.2s ease; }
    .card:hover { transform: translateY(-5px); border-color: #e50914; }
    .video-container { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; background-color: #000; overflow: hidden; }
    .video-container .card-cover { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    .card-body { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex-grow: 1; }
    .card-title { font-size: 14px; color: #ffffff; text-transform: uppercase; }
    .card-category { font-size: 10px; color: #e50914; text-transform: uppercase; letter-spacing: 1px; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content { position: relative; width: 90%; max-width: 900px; background: #000; border-radius: 8px; overflow: hidden; box-shadow: 0 0 20px rgba(229, 9, 20, 0.4); }
    .modal-video-container { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; }
    .modal-video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .close-btn { position: absolute; top: 10px; right: 15px; color: #fff; font-size: 28px; font-weight: bold; cursor: pointer; z-index: 1001; line-height: 1; }
    .close-btn:hover { color: #e50914; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="logo"><a href="index.html">CORTIS-FLIX</a></div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">HOME</a></li>
        <li><a href="mv.html">MV</a></li>
        <li><a href="documentario.html">DOCUMENTARIO</a></li>
        <li><a href="practice.html">PRACTICE</a></li>
        <li><a href="dietro-le-quinte.html">DIETRO LE QUINTE</a></li>
        <li><a href="shows.html" class="active">SHOWS</a></li>
      </ul>
    </nav>
    <div class="search-box">
      <input type="text" id="searchInput" onkeyup="searchCards()" placeholder="Cerca video...">
    </div>
  </header>

  <!-- Lista Video dello Show -->
  <main class="main-content">
    <a href="shows.html" class="back-btn">&larr; Torna a tutti gli Shows</a>
    <h1 class="section-title">INKIGAYO</h1>
    
    <div class="card-grid" id="cardGrid">

     

      <a href="https://youtu.be/5lkjibpKPKU?si=yDXc_yVE5cONpdRT" target="_blank" class="card">
  <div class="video-container">
    <img src="foto/hqdefault.jpg" alt="Copertina" class="card-cover">
  </div>
  <div class="card-body">
    <span class="card-category">PERFORMANCE</span>
    <div class="card-title">'What You Want'│CORTIS ONE TAKE STAGE│250824</div>
  </div>
</a>

    </div>
  </main>

  <!-- Pop-Up Modal -->
  <div class="modal-overlay" id="videoModal" onclick="closeVideoModal(event)">
    <div class="modal-content">
      <span class="close-btn" onclick="forceCloseModal()">&times;</span>
      <div class="modal-video-container" id="modalPlayerWrapper"></div>
    </div>
  </div>

  <script>
    const modal = document.getElementById('videoModal');
    const playerWrapper = document.getElementById('modalPlayerWrapper');

    document.getElementById('cardGrid').addEventListener('click', function(e) {
      const card = e.target.closest('.card');
      if (card) {
        const src = card.getAttribute('data-video-src');
        if (src) openVideoModal(src);
      }
    });

    function openVideoModal(videoSrc) {
      playerWrapper.innerHTML = `<iframe id="modalVideoPlayer" src="${videoSrc}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
      modal.classList.add('active');
    }

    function forceCloseModal() {
      modal.classList.remove('active');
      playerWrapper.innerHTML = '';
    }

    function closeVideoModal(event) {
      if (event.target === modal) forceCloseModal();
    }

    function searchCards() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('.card').forEach(card => {
        const title = card.querySelector('.card-title').innerText.toLowerCase();
        card.style.display = title.includes(input) ? 'flex' : 'none';
      });
    }
  </script>

</body>
</html>
