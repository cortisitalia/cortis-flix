<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CORTIS-FLIX - Home</title>
  <style>
    /* Reset base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Arial Black', Arial, sans-serif;
      padding-bottom: 50px;
    }

    /* Header e Navigation Bar */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #0d0d0d;
      padding: 15px 30px;
      border-bottom: 2px solid #222;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo a {
      color: #e50914;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-decoration: none;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      background: none;
      border: none;
      color: #b3b3b3;
      font-family: inherit;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-decoration: none;
      padding-bottom: 4px;
      transition: color 0.2s, border-color 0.2s;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: #ffffff;
      border-bottom: 2px solid #e50914;
    }

    .search-box input {
      background-color: #ffffff;
      border: none;
      padding: 6px 12px;
      border-radius: 2px;
      font-size: 12px;
      outline: none;
    }

    /* Layout Sezioni */
    .main-content {
      padding: 30px;
    }

    .section {
      margin-bottom: 40px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .section-title {
      font-size: 18px;
      text-transform: uppercase;
      color: #e5e5e5;
    }

    .see-more {
      color: #e50914;
      font-size: 12px;
      text-decoration: none;
      text-transform: uppercase;
    }

    .see-more:hover {
      text-decoration: underline;
    }

    /* Griglia Principale */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    /* Scheda Video / Programma */
    .card {
      background-color: #1a1a1a;
      border: 2px solid #2a2a2a;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: #e50914;
    }

    /* Contenitore per le Copertine */
    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* Rapporto 16:9 */
      height: 0;
      background-color: #000000;
      overflow: hidden;
    }

    .video-container .card-cover {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-grow: 1;
    }

    .card-title {
      font-size: 14px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .card-category {
      font-size: 10px;
      color: #e50914;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* STILI POP-UP (MODAL) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      position: relative;
      width: 90%;
      max-width: 900px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(229, 9, 20, 0.4);
    }

    .modal-video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
    }

    .modal-video-container video,
    .modal-video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      color: #fff;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      z-index: 1001;
      line-height: 1;
    }

    .close-btn:hover {
      color: #e50914;
    }
  </style>
</head>
<body>

  <!-- Header con Link alle Pagine del Sito -->
  <header class="navbar">
    <div class="logo"><a href="index.html">CORTIS-FLIX</a></div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html" class="active">HOME</a></li>
        <li><a href="mv.html">MV</a></li>
        <li><a href="documentario.html">DOCUMENTARIO</a></li>
        <li><a href="practice.html">PRACTICE</a></li>
        <li><a href="dietro-le-quinte.html">DIETRO LE QUINTE</a></li>
        <li><a href="shows.html">SHOWS</a></li>
        <li><a href="release-party.html">RELEASE PARTY</a></li>
      </ul>
    </nav>
    <div class="search-box">
      <input type="text" id="searchInput" onkeyup="searchCards()" placeholder="Cerca video...">
    </div>
  </header>

  <!-- Contenuto Principale (Home Page) -->
  <main class="main-content">
    
    <!-- Ultimi Caricamenti in Evidenza -->
    <section class="section">
      <div class="section-header">
        <h2 class="section-title">In Evidenza / Ultimi Arrivi</h2>
      </div>
      
      <div class="card-grid" id="cardGrid">

        <!-- VIDEO GOOGLE DRIVE -->
        <div class="card" onclick="openVideoModal('https://drive.google.com/file/d/1g-GFHe458kRj7whZ3QQGZvUkStaTNiFm/preview')">
          <div class="video-container">
            <img src="foto/screenshot-35.png" alt="Copertina Video" class="card-cover">
          </div>
          <div class="card-body">
            <span class="card-category">MV</span>
            <div class="card-title">FROCIONE</div>
          </div>
        </div>

        <!-- DOCUMENTARIO GOOGLE DRIVE -->
        <div class="card" onclick="openVideoModal('https://drive.google.com/file/d/1qVwlRuFf0BCvBT-384eNrdI7ulG2tj5T/preview')">
          <div class="video-container">
            <img src="foto/screenshot-35.png" alt="Copertina Video" class="card-cover">
          </div>
          <div class="card-body">
            <span class="card-category">DOCUMENTARIO</span>
            <div class="card-title">RICKY GAY</div>
          </div>
        </div>

        <!-- DANCE PRACTICE -->
        <div class="card" onclick="openVideoModal('video/dance-practice.mp4')">
          <div class="video-container">
            <img src="https://via.placeholder.com/400x225/111/fff?text=Dance+Practice" alt="Copertina" class="card-cover">
          </div>
          <div class="card-body">
            <span class="card-category">Practice</span>
            <div class="card-title">Dance Practice</div>
          </div>
        </div>

        <!-- DOCUMENTARIO YOUTUBE -->
        <div class="card" onclick="openVideoModal('https://www.youtube.com/embed/GQT6tFK3gPg')">
          <div class="video-container">
            <img src="https://via.placeholder.com/400x225/222/fff?text=Documentario" alt="Copertina" class="card-cover">
          </div>
          <div class="card-body">
            <span class="card-category">Documentario</span>
            <div class="card-title">Documentario YouTube</div>
          </div>
        </div>

      </div>
    </section>

  </main>

  <!-- STRUTTURA DEL POP-UP (MODAL) -->
  <div class="modal-overlay" id="videoModal" onclick="closeVideoModal(event)">
    <div class="modal-content">
      <span class="close-btn" onclick="forceCloseModal()">&times;</span>
      <div class="modal-video-container" id="modalPlayerWrapper">
        <!-- Player inserito dinamicamente -->
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT PER RICERCA E POP-UP -->
  <script>
    // Ricerca live tra i video della home
    function searchCards() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('.card');

      cards.forEach(card => {
        const title = card.querySelector('.card-title').innerText.toLowerCase();
        const category = card.querySelector('.card-category').innerText.toLowerCase();
        if (title.includes(input) || category.includes(input)) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }

    // Gestione Pop-up Video
    const modal = document.getElementById('videoModal');
    const playerWrapper = document.getElementById('modalPlayerWrapper');

    function openVideoModal(videoSrc) {
      if (videoSrc.toLowerCase().endsWith('.mp4')) {
        playerWrapper.innerHTML = `
          <video id="modalVideoPlayer" controls autoplay>
            <source src="${videoSrc}" type="video/mp4">
            Il browser non supporta la riproduzione.
          </video>`;
      } else {
        playerWrapper.innerHTML = `
          <iframe id="modalVideoPlayer" src="${videoSrc}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
      }
      modal.classList.add('active');
    }

    function forceCloseModal() {
      modal.classList.remove('active');
      playerWrapper.innerHTML = '';
    }

    function closeVideoModal(event) {
      if (event.target === modal) {
        forceCloseModal();
      }
    }
  </script>

</body>
</html>
