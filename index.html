<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CORTIS-FLIX - Home</title>
  <style>
    /* VARIABILI E RESET */
    :root {
      --netflix-red: #e50914;
      --bg-color: #141414;
      --text-light: #e5e5e5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-color); color: #fff; overflow-x: hidden; }

    /* NAVBAR */
    .navbar { display: flex; align-items: center; justify-content: space-between; padding: 15px 4%; background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%); position: sticky; top: 0; z-index: 100; transition: background 0.3s; }
    .navbar.scrolled { background-color: var(--bg-color); }
    .logo a { color: var(--netflix-red); font-size: 28px; font-weight: 900; text-decoration: none; letter-spacing: 1px; }
    
    .nav-center { display: flex; align-items: center; gap: 20px; }
    .nav-links { list-style: none; display: flex; gap: 18px; }
    .nav-links a { color: var(--text-light); font-size: 14px; text-decoration: none; transition: 0.3s; cursor: pointer; }
    .nav-links a:hover, .nav-links a.active { color: #fff; font-weight: bold; }

    .mobile-menu-btn { display: none; background: none; border: none; color: white; font-size: 24px; cursor: pointer; }

    /* HERO SECTION (Banner Indice) */
    .hero { position: relative; height: 60vh; background: url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80') center/cover; display: flex; align-items: flex-end; padding: 4% 4%; margin-bottom: 20px; }
    .hero-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, var(--bg-color) 0%, transparent 60%); }
    .hero-content { position: relative; z-index: 10; max-width: 600px; }
    .hero-tag { background-color: var(--netflix-red); color: white; font-size: 12px; font-weight: bold; padding: 3px 8px; border-radius: 2px; text-transform: uppercase; display: inline-block; margin-bottom: 8px; }
    .hero-title { font-size: 2.8rem; font-weight: 900; text-transform: uppercase; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
    .hero-desc { font-size: 1rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); margin-bottom: 15px; color: #ddd; }
    .play-btn { background-color: #fff; color: #000; padding: 8px 24px; font-size: 1rem; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
    .play-btn:hover { background-color: rgba(255,255,255,0.75); }

    /* CATEGORY CONTAINER & RIGHE */
    .main-container { padding-top: 10px; }
    .row { margin-left: 4%; margin-bottom: 35px; }
    .row-title { font-size: 1.3rem; font-weight: bold; color: #e5e5e5; margin-bottom: 12px; display: inline-block; cursor: pointer; transition: color 0.2s; }
    .row-title:hover { color: var(--netflix-red); }
    .row-title::after { content: " >"; font-size: 0.9em; opacity: 0.7; }
    
    .row-posters { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 15px; padding-top: 5px; scroll-behavior: smooth; }
    .row-posters::-webkit-scrollbar { display: none; }
    .row-posters { -ms-overflow-style: none; scrollbar-width: none; } 

    /* CARDS */
    .card { flex: 0 0 240px; position: relative; cursor: pointer; border-radius: 4px; overflow: hidden; transition: transform 0.3s ease, border-color 0.3s ease; background-color: #1f1f1f; }
    .card:hover { transform: scale(1.06); z-index: 10; box-shadow: 0 5px 15px rgba(0,0,0,0.8); border: 1px solid var(--netflix-red); }
    .video-container { width: 100%; padding-bottom: 56.25%; height: 0; position: relative; }
    .card-cover { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    .card-info { padding: 10px; }
    .card-title { font-size: 13px; font-weight: bold; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-category { font-size: 10px; color: var(--netflix-red); font-weight: bold; text-transform: uppercase; margin-bottom: 2px; }
    .card-date { font-size: 11px; color: #bbb; font-style: italic; } /* Stile della data */

    /* MODAL POP-UP VIDEO */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content { position: relative; width: 90%; max-width: 900px; background: #000; border-radius: 8px; box-shadow: 0 0 30px rgba(0,0,0,0.9); border: 1px solid #333; }
    .modal-video-container { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; }
    .modal-video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; border-radius: 8px; }
    .close-btn { position: absolute; top: -40px; right: 0; color: #fff; font-size: 35px; cursor: pointer; z-index: 1001; }
    .close-btn:hover { color: var(--netflix-red); }

    /* RESPONSIVE MOBILE */
    @media (max-width: 768px) {
      .mobile-menu-btn { display: block; }
      .nav-links { display: none; flex-direction: column; position: absolute; top: 60px; left: 0; background-color: rgba(0,0,0,0.95); width: 100%; padding: 20px; text-align: center; gap: 15px; border-bottom: 2px solid var(--netflix-red); }
      .nav-links.active { display: flex; }
      .hero { height: 45vh; }
      .hero-title { font-size: 1.8rem; }
      .card { flex: 0 0 160px; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR CON IL NUOVO MENU "EXTRA" -->
  <header class="navbar" id="navbar">
    <div class="logo"><a href="index.html">CORTIS-FLIX</a></div>
    <div class="nav-center">
      <button class="mobile-menu-btn" onclick="toggleMenu()">☰</button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html" class="active">HOME</a></li>
        <li><a href="documentario.html">DOCUMENTARIO</a></li>
        <li><a href="dietro-le-quinte.html">DIETRO LE QUINTE</a></li>
        <li><a href="youtube.html">YOUTUBE</a></li>
        <li><a href="live.html">LIVE</a></li>
        <li><a href="extra.html">EXTRA</a></li>
      </ul>
    </div>
  </header>

  <main class="main-container">
    <!-- HERO SECTION (Banner Indice) -->
    <section class="hero" id="heroSection">
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <span class="hero-tag">Nuovo Inserimento</span>
        <h1 class="hero-title">Ultima Release</h1>
        <p class="hero-desc">Guarda ora l'ultimo contenuto tradotto inserito dalla community CORTIS.</p>
        <button class="play-btn" onclick="openVideoModal('https://www.youtube.com/embed/dQw4w9WgXcQ')">
          <span style="font-size: 1.2rem;">▶</span> Riproduci
        </button>
      </div>
    </section>

    <!-- QUI APPARIRANNO LE RIGHE IN AUTOMATICO -->
    <div id="categoryRows"></div>
  </main>

  <!-- POP-UP VIDEO -->
  <div class="modal-overlay" id="videoModal" onclick="closeVideoModal(event)">
    <div class="modal-content">
      <span class="close-btn" onclick="forceCloseModal()">&times;</span>
      <div class="modal-video-container" id="modalPlayerWrapper"></div>
    </div>
  </div>

  <!-- COLLEGA IL DATABASE DEI VIDEO -->
  <script src="database.js"></script>
  
  <!-- LOGICA DELLA PAGINA -->
  <script>
    // SCROLL NAVBAR: cambia colore quando scorri in giù
    window.addEventListener('scroll', () => {
      const navbar = document.getElementById('navbar');
      if (window.scrollY > 50) {
        navbar.classList.add('scrolled');
      } else {
        navbar.classList.remove('scrolled');
      }
    });

    // MENU MOBILE: apri/chiudi tendina su telefono
    function toggleMenu() {
      document.getElementById('navLinks').classList.toggle('active');
    }

    // GENERAZIONE AUTOMATICA DELLE RIGHE leggendo database.js
    window.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('categoryRows');

      // Verifica se database.js è stato caricato correttamente
      if (typeof videoData === 'undefined' || typeof categories === 'undefined') {
        container.innerHTML = `<p style="margin-left: 4%; color: red;">Errore: file database.js non trovato. Assicurati di averlo creato nella stessa cartella!</p>`;
        return;
      }

      // Crea le righe dinamicamente
      Object.keys(categories).forEach(catKey => {
        const catVideos = videoData.filter(v => v.category === catKey);
        
        if (catVideos.length > 0) {
          const rowDiv = document.createElement('div');
          rowDiv.className = 'row';
          
          let cardsHTML = catVideos.map(video => {
            // Se esiste la data nel database, la prepara per stamparla
            const dateHtml = video.date ? `<div class="card-date">${video.date}</div>` : '';
            
            return `
              <div class="card" onclick="openVideoModal('${video.videoSrc}')">
                <div class="video-container">
                  <img src="${video.cover}" class="card-cover" alt="Copertina">
                </div>
                <div class="card-info">
                  <div class="card-title">${video.title}</div>
                  <div class="card-category">${categories[video.category]}</div>
                  ${dateHtml} <!-- Ecco la data aggiunta! -->
                </div>
              </div>
            `;
          }).join('');

          // Cliccando sul titolo della riga, ti porta alla sua pagina html (es. documentario.html)
          rowDiv.innerHTML = `
            <a href="${catKey}.html" style="text-decoration:none;">
              <h2 class="row-title">${categories[catKey]}</h2>
            </a>
            <div class="row-posters">${cardsHTML}</div>
          `;
          container.appendChild(rowDiv);
        }
      });
    });

    // GESTIONE MODAL (POP-UP) PER I VIDEO
    const modal = document.getElementById('videoModal');
    const playerWrapper = document.getElementById('modalPlayerWrapper');

    function openVideoModal(src) {
      playerWrapper.innerHTML = `<iframe src="${src}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
      modal.classList.add('active');
    }

    function forceCloseModal() { 
      modal.classList.remove('active'); 
      playerWrapper.innerHTML = ''; 
    }

    function closeVideoModal(e) { 
      if (e.target === modal) forceCloseModal(); 
    }
  </script>
</body>
</html>
