<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CORTIS-FLIX - Shows</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #121212; color: #ffffff; font-family: 'Arial Black', Arial, sans-serif; padding-bottom: 50px; }
    .navbar { display: flex; align-items: center; justify-content: space-between; background-color: #0d0d0d; padding: 15px 30px; border-bottom: 2px solid #222; position: sticky; top: 0; z-index: 100; }
    .logo a { color: #e50914; font-size: 28px; font-weight: bold; letter-spacing: 1.5px; text-decoration: none; }
    .nav-links { list-style: none; display: flex; gap: 20px; }
    .nav-links a { color: #b3b3b3; font-size: 13px; text-transform: uppercase; text-decoration: none; padding-bottom: 4px; transition: color 0.2s, border-color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: #ffffff; border-bottom: 2px solid #e50914; }
    .search-box input { background-color: #ffffff; border: none; padding: 6px 12px; border-radius: 2px; font-size: 12px; outline: none; }
    .main-content { padding: 30px; }
    .section-title { font-size: 18px; text-transform: uppercase; color: #e5e5e5; margin-bottom: 20px; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    
    /* Scheda Programma (Link a pagina dedicata) */
    .show-card { background-color: #1a1a1a; border: 2px solid #2a2a2a; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; text-decoration: none; color: inherit; transition: transform 0.2s ease, border-color 0.2s ease; }
    .show-card:hover { transform: translateY(-5px); border-color: #e50914; }
    .video-container { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; background-color: #000; overflow: hidden; }
    .video-container .card-cover { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    .card-body { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex-grow: 1; }
    .card-title { font-size: 14px; color: #ffffff; text-transform: uppercase; }
    .card-category { font-size: 10px; color: #e50914; text-transform: uppercase; letter-spacing: 1px; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="logo"><a href="index.html">CORTIS-FLIX</a></div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">HOME</a></li>
        <li><a href="mv.html">MV</a></li>
        <li><a href="documentario.html">DOCUMENTARIO</a></li>
        <li><a href="practice.html">PRACTICE</a></li>
        <li><a href="dietro-le-quinte.html">DIETRO LE QUINTE</a></li>
        <li><a href="shows.html" class="active">SHOWS</a></li>
      </ul>
    </nav>
    <div class="search-box">
      <input type="text" id="searchInput" onkeyup="searchCards()" placeholder="Cerca Show...">
    </div>
  </header>

  <!-- Catalogo Shows -->
  <main class="main-content">
    <section class="section">
      <h2 class="section-title">I Nostri Programmi TV & Performances</h2>
      
      <div class="card-grid" id="cardGrid">

        <!-- INKIGAYO -->
        <a href="show/inkigayo.html" class="show-card">
          <div class="video-container">
            <img src="foto/copertina-ikinagayo.png" alt="Inkigayo" class="card-cover">
          </div>
          <div class="card-body">
            <span class="card-category">Music Show</span>
            <div class="card-title">INKIGAYO</div>
          </div>
        </a>

        <!-- M COUNTDOWN -->
        <a href="show/musicbank.html" class="show-card">
          <div class="video-container">
            <img src="foto/copertina-kiseigen.png" alt="M Countdown" class="card-cover">
          </div>
          <div class="card-body">
            <span class="card-category">Music Show</span>
            <div class="card-title">M COUNTDOWN</div>
          </div>
        </a>

        <!-- MUSIC BANK -->
        <a href="musicbank.html" class="show-card">
          <div class="video-container">
            <img src="foto/copertina-kiseigen.png" alt="Music Bank" class="card-cover">
          </div>
          <div class="card-body">
            <span class="card-category">Music Show</span>
            <div class="card-title">MUSIC BANK</div>
          </div>
        </a>

        <!-- RELEASE PARTY -->
        <a href="releaseparty.html" class="show-card">
          <div class="video-container">
            <img src="foto/copertina-kiseigen.png" alt="Release Party" class="card-cover">
          </div>
          <div class="card-body">
            <span class="card-category">PARTY</span>
            <div class="card-title">RELEASE PARTY</div>
          </div>
        </a>

        <!-- KISEIGEN -->
        <a href="kiseigen.html" class="show-card">
          <div class="video-container">
            <img src="foto/copertina-kiseigen.png" alt="Kiseigen" class="card-cover">
          </div>
          <div class="card-body">
            <span class="card-category">Music Show</span>
            <div class="card-title">KISEIGEN</div>
          </div>
        </a>

        <!-- STUDIO CHOOM -->
        <a href="studiochoom.html" class="show-card">
          <div class="video-container">
            <img src="foto/copertina-kiseigen.png" alt="Studio Choom" class="card-cover">
          </div>
          <div class="card-body">
            <span class="card-category">YOUTUBE PERFORMANCE</span>
            <div class="card-title">STUDIO CHOOM</div>
          </div>
        </a>

        <!-- MORE SHOW -->
        <a href="moreshow.html" class="show-card">
          <div class="video-container">
            <img src="foto/copertina-kiseigen.png" alt="More" class="card-cover">
          </div>
          <div class="card-body">
            <span class="card-category">SHOW</span>
            <div class="card-title">MORE</div>
          </div>
        </a>

        <!-- YOUTUBE -->
        <a href="youtube.html" class="show-card">
          <div class="video-container">
            <img src="foto/copertina-kiseigen.png" alt="YouTube" class="card-cover">
          </div>
          <div class="card-body">
            <span class="card-category">YOUTUBE</span>
            <div class="card-title">YOUTUBE</div>
          </div>
        </a>

      </div>
    </section>
  </main>

  <script>
    function searchCards() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('.show-card').forEach(card => {
        const title = card.querySelector('.card-title').innerText.toLowerCase();
        card.style.display = title.includes(input) ? 'flex' : 'none';
      });
    }
  </script>

</body>
</html>
